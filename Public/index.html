<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Doces</title>

    <link rel="stylesheet" href="index.css">

</head>

<body>

    <header>Catálogo de Doces</header>

    <main>
        <div class="container">

            <h1>Sistema de pesquisa de doces</h1>

            <div class="galeria">
                <div class="card">
                    <img src="pao-de-mel.jpeg" alt="Pão de Mel">
                    <p>Pão de Mel</p>
                </div>

                <div class="card">
                    <img src="trufa.jpeg" alt="Trufa">
                    <p>Trufa</p>
                </div>
            </div>

            <button onclick="ftodos()">Listar todos os doces</button>
            <button onclick="ftrufas()">Listar Trufas</button>
            <button onclick="fpaodemel()">Listar Pães de Mel</button>

            <!-- Área com rolagem -->
            <div class="resultado-container">
                <div id="resultado" class="resultado"></div>
            </div>

        </div>
    </main>

    <footer>Maria Eduarda Brito Lucheti Martioli</footer>

    <script>

        const enderecoServidor = 'localhost';
        const porta = '3001';

        async function ftodos() {

            try {

                const resposta = await fetch(
                    `http://${enderecoServidor}:${porta}/doces`
                );

                const dados = await resposta.json();

                if (!Array.isArray(dados)) {
                    document.getElementById('resultado').innerHTML =
                        'Erro retornado pelo servidor.';
                    return;
                }

                let html = '';

                dados.forEach(doce => {

                    html += `
                        <h3>${doce.nome_doce}</h3>
                        <p>Preço: R$ ${doce.preco}</p>
                        <hr>
                    `;
                });

                document.getElementById('resultado').innerHTML = html;

            } catch (erro) {

                console.error('Erro:', erro);

                document.getElementById('resultado').innerHTML =
                    'Erro ao consultar o servidor.';
            }
        }

        async function ftrufas() {

            try {

                const resposta = await fetch(
                    `http://${enderecoServidor}:${porta}/trufas`
                );

                const dados = await resposta.json();

                if (!Array.isArray(dados)) {
                    document.getElementById('resultado').innerHTML =
                        'Erro retornado pelo servidor.';
                    return;
                }

                let html = '';

                dados.forEach(doce => {

                    html += `
                        <h3>${doce.nome_doce}</h3>
                        <p>Preço: R$ ${doce.preco}</p>
                        <hr>
                    `;
                });

                document.getElementById('resultado').innerHTML = html;

            } catch (erro) {

                console.error('Erro:', erro);

                document.getElementById('resultado').innerHTML =
                    'Erro ao consultar o servidor.';
            }
        }

        async function fpaodemel() {

            try {

                const resposta = await fetch(
                    `http://${enderecoServidor}:${porta}/paodemel`
                );

                const dados = await resposta.json();

                if (!Array.isArray(dados)) {
                    document.getElementById('resultado').innerHTML =
                        'Erro retornado pelo servidor.';
                    return;
                }

                let html = '';

                dados.forEach(doce => {

                    html += `
                        <h3>${doce.nome_doce}</h3>
                        <p>Preço: R$ ${doce.preco}</p>
                        <hr>
                    `;
                });

                document.getElementById('resultado').innerHTML = html;

            } catch (erro) {

                console.error('Erro:', erro);

                document.getElementById('resultado').innerHTML =
                    'Erro ao consultar o servidor.';
            }
        }

    </script>

</body>

</html>
